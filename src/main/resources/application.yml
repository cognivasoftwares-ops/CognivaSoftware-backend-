server:
  port: ${PORT:8080}

spring:
  application:
    name: cogniva-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cogniva_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: none              # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    # MUST be at least 32 characters. Override in production via JWT_SECRET env var.
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-please-override-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # Created on first start-up if no admin user exists yet.
    email: ${ADMIN_EMAIL:admin@cognivasoftwares.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
    name: ${ADMIN_NAME:Cogniva Admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.cogniva: INFO
